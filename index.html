<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torimatrix</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --text: #e6ecff;
        --muted: #a6b4d9;
        --accent: #7c9cff;
        --accent-2: #65d9c2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(760px, 90vw);
        background: rgba(18, 26, 43, 0.92);
        border: 1px solid rgba(124, 156, 255, 0.25);
        border-radius: 18px;
        padding: 3rem 2.5rem;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      .badge {
        display: inline-block;
        padding: 0.4rem 0.8rem;
        border-radius: 999px;
        background: rgba(101, 217, 194, 0.13);
        color: var(--accent-2);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 700;
      }
      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(2.2rem, 5vw, 4rem);
      }
      p {
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
        margin: 0 auto 1.5rem;
        max-width: 52ch;
      }
      .cta {
        display: inline-block;
        padding: 0.9rem 1.5rem;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #09111f;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Torimatrix</div>
      <h1>Welcome to Torimatrix</h1>
      <p>
        Your project site is ready to go. This static landing page is placed at the root of the repository
        so it can be served via GitHub Pages once the Pages source is enabled in the repo settings.
      </p>
      <a class="cta" href="https://github.com/ZacaUltim/torimatrix">View repository</a>
    </main>
  </body>
</html>
